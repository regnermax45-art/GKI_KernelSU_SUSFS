name: Advanced Kernel Build Process
permissions:
  contents: write
  actions: write
  packages: none

on:
  workflow_call:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      revision:
        required: false
        type: string
        default: "r0"
      target_devices:
        required: false
        type: string
        default: "generic"
      build_variants:
        required: false
        type: string
        default: "all"

env:
  WORKSPACE: ${{ github.workspace }}
  BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
  KERNEL_SRC_DIR: ${{ github.workspace }}/kernel_src
  TOOLS_DIR: ${{ github.workspace }}/build_tools
  CACHE_DIR: ${{ github.workspace }}/.cache

jobs:
  setup-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      config_name: ${{ steps.set-config.outputs.config_name }}
      actual_sublevel: ${{ steps.detect-sublevel.outputs.actual_sublevel }}
      clang_version: ${{ steps.detect-clang.outputs.clang_version }}
      build_matrix: ${{ steps.generate-matrix.outputs.build_matrix }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup Build Environment
      run: |
        sudo apt update && sudo apt full-upgrade -y
        sudo apt install -y \
          libelf-dev libssl-dev build-essential \
          flex bison bc cpio dwarves python3-dev \
          git-lfs rsync patchelf ccache \
          python3-pip python3-venv ninja-build \
          device-tree-compiler lz4 zstd \
          libcap-dev libnuma-dev libbfd-dev \
          libiberty-dev libzstd-dev liblz4-dev

        # Install additional Python packages
        pip3 install --upgrade pip
        pip3 install protobuf pyelftools

    - name: Set Config Environment Variable
      id: set-config
      run: |
        CONFIG_NAME="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
        echo "config_name=$CONFIG_NAME" >> $GITHUB_OUTPUT
        echo "CONFIG_NAME=$CONFIG_NAME" >> $GITHUB_ENV

    - name: Create Directory Structure
      run: |
        mkdir -p ${{ env.BUILD_ARTIFACTS_DIR }}
        mkdir -p ${{ env.KERNEL_SRC_DIR }}
        mkdir -p ${{ env.TOOLS_DIR }}
        mkdir -p ${{ env.CACHE_DIR }}/ccache
        mkdir -p ${{ env.CACHE_DIR }}/repo

    - name: Setup CCache
      run: |
        echo "CCACHE_DIR=${{ env.CACHE_DIR }}/ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=10G" >> $GITHUB_ENV
        echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
        ccache --show-stats

    - name: Detect Actual Sublevel for LTS
      id: detect-sublevel
      if: inputs.sub_level == 'X'
      run: |
        # This will be populated during source sync
        echo "actual_sublevel=detect_later" >> $GITHUB_OUTPUT

    - name: Detect Clang Version
      id: detect-clang
      run: |
        # Predefined clang versions based on Android version
        case "${{ inputs.android_version }}" in
          android12)
            CLANG_VER="clang-r450784d"
            ;;
          android13)
            CLANG_VER="clang-r487747c"
            ;;
          android14)
            CLANG_VER="clang-r510928a"
            ;;
          android15)
            CLANG_VER="clang-r530050a"
            ;;
          *)
            CLANG_VER="clang-r510928a"
            ;;
        esac
        echo "clang_version=$CLANG_VER" >> $GITHUB_OUTPUT

    - name: Generate Build Matrix
      id: generate-matrix
      run: |
        BUILD_TYPES=("bazel" "make")
        VARIANTS=()
        
        IFS=',' read -ra DEVICES <<< "${{ inputs.target_devices }}"
        IFS=',' read -ra BUILD_VARIANTS <<< "${{ inputs.build_variants }}"
        
        for device in "${DEVICES[@]}"; do
          for build_type in "${BUILD_TYPES[@]}"; do
            for variant in "${BUILD_VARIANTS[@]}"; do
              VARIANTS+=("{\"device\":\"$device\", \"build_type\":\"$build_type\", \"variant\":\"$variant\"}")
            done
          done
        done
        
        MATRIX_JSON=$(printf '%s\n' "${VARIANTS[@]}" | jq -sc '.')
        echo "build_matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  sync-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: setup-environment
    outputs:
      actual_sublevel: ${{ steps.detect-sublevel-final.outputs.actual_sublevel }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Create Directory Structure
      run: |
        mkdir -p ${{ env.BUILD_ARTIFACTS_DIR }}
        mkdir -p ${{ env.KERNEL_SRC_DIR }}
        mkdir -p ${{ env.TOOLS_DIR }}
        mkdir -p ${{ env.CACHE_DIR }}/ccache
        mkdir -p ${{ env.CACHE_DIR }}/repo

    - name: Setup Repo Tool
      run: |
        mkdir -p ${{ env.TOOLS_DIR }}
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ${{ env.TOOLS_DIR }}/repo
        chmod a+x ${{ env.TOOLS_DIR }}/repo
        echo "${{ env.TOOLS_DIR }}" >> $GITHUB_PATH

    - name: Initialize Kernel Repository
      run: |
        mkdir -p ${{ env.KERNEL_SRC_DIR }}
        cd ${{ env.KERNEL_SRC_DIR }}
        
        BRANCH_NAME="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
        
        repo init --depth=1 \
          -u https://android.googlesource.com/kernel/manifest \
          -b common-${BRANCH_NAME} \
          --repo-rev=v2.16 \
          --repo-url=https://gerrit.googlesource.com/git-repo

    - name: Sync Repository
      run: |
        cd ${{ env.KERNEL_SRC_DIR }}
        repo sync -c -j$(nproc --all) --no-tags --fail-fast --force-sync

    - name: Detect Actual Sublevel
      id: detect-sublevel-final
      run: |
        cd ${{ env.KERNEL_SRC_DIR }}/common
        if [ -f "Makefile" ]; then
          ACTUAL_SUBLEVEL=$(grep '^SUBLEVEL = ' Makefile | awk '{print $3}')
          if [ -n "$ACTUAL_SUBLEVEL" ]; then
            echo "actual_sublevel=$ACTUAL_SUBLEVEL" >> $GITHUB_OUTPUT
          else
            echo "actual_sublevel=${{ inputs.sub_level }}" >> $GITHUB_OUTPUT
          fi
        else
          echo "actual_sublevel=${{ inputs.sub_level }}" >> $GITHUB_OUTPUT
        fi

  build-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    needs: [setup-environment, sync-sources]
    strategy:
      matrix: ${{ fromJson(needs.setup-environment.outputs.build_matrix) }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Restore Workspace
      run: |
        cp -r ${{ env.KERNEL_SRC_DIR }}/* .
        mv ${{ needs.setup-environment.outputs.config_name }} kernel_build

    - name: Setup Build Tools
      run: |
        # Clone build tools
        git clone --depth=1 https://android.googlesource.com/kernel/prebuilts/build-tools ${{ env.TOOLS_DIR }}/build-tools
        git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg ${{ env.TOOLS_DIR }}/mkbootimg
        
        echo "PATH=${{ env.TOOLS_DIR }}/build-tools/linux-x86/bin:$PATH" >> $GITHUB_ENV
        echo "AVBTOOL=${{ env.TOOLS_DIR }}/build-tools/linux-x86/bin/avbtool" >> $GITHUB_ENV
        echo "MKBOOTIMG=${{ env.TOOLS_DIR }}/mkbootimg/mkbootimg.py" >> $GITHUB_ENV

    - name: Clone Dependencies
      run: |
        git clone --depth=1 https://github.com/WildKernels/AnyKernel3.git -b gki-2.0
        git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}
        git clone --depth=1 https://github.com/WildKernels/kernel_patches.git
        git clone --depth=1 https://github.com/kernelsu-android/kernel_patches.git kernelsu_patches

    - name: Apply Base Patches
      run: |
        cd kernel_build/common
        
        # Apply glibc compatibility fix
        if [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "6.1" ]]; then
          sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile
        fi

        # Apply namespace.c fix for Android15 6.6
        if [[ "${{ inputs.android_version }}" == "android15" && "${{ inputs.kernel_version }}" == "6.6" ]]; then
          if ! grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c; then
            sed -i '/#include <trace\/hooks\/blk.h>/a #include <trace\/hooks\/fs.h>' ./fs/namespace.c
          fi
        fi

    - name: Apply KernelSU
      run: |
        cd kernel_build
        curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s wild

    - name: Apply SUSFS Patches
      run: |
        cd kernel_build
        
        # Apply core SUSFS patches
        cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch ./common/
        cd common
        patch -p1 --forward < 50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch
        cd ..
        
        cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
        cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/

    - name: Apply Device Specific Patches
      run: |
        cd kernel_build
        
        # Pixel 7 Pro specific patches
        if [[ "${{ matrix.device }}" == "pixel7pro" || "${{ matrix.device }}" == "cheetah" ]]; then
          echo "Applying Pixel 7 Pro specific patches..."
          
          # GPU optimization patches
          cp ../kernel_patches/pixel7pro/gpu/*.patch ./common/drivers/gpu/drm/
          
          # Display patches
          cp ../kernel_patches/pixel7pro/display/*.patch ./common/drivers/gpu/drm/msm/
          
          # Power management patches
          cp ../kernel_patches/pixel7pro/power/*.patch ./common/drivers/soc/google/
          
          # Apply patches
          for patch_file in ./common/drivers/gpu/drm/*.patch; do
            patch -p1 --forward -d ./common < "$patch_file" || true
          done
        fi

    - name: Configure Kernel
      run: |
        cd kernel_build/common
        
        DEFCONFIG="arch/arm64/configs/gki_defconfig"
        
        # Base configuration
        echo "CONFIG_KSU=y" >> $DEFCONFIG
        echo "CONFIG_KSU_KPROBES_HOOK=n" >> $DEFCONFIG
        
        # SUSFS Configuration
        echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
        echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $DEFCONFIG
        echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
        echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
        
        # Performance optimizations
        echo "CONFIG_LTO_CLANG_THIN=y" >> $DEFCONFIG
        echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> $DEFCONFIG
        echo "CONFIG_SCHED_CORE=y" >> $DEFCONFIG
        
        # Device specific configurations
        if [[ "${{ matrix.device }}" == "pixel7pro" ]]; then
          echo "CONFIG_GOOGLE_DEBUG_SNAPSHOT=y" >> $DEFCONFIG
          echo "CONFIG_GOOGLE_LOGGER=y" >> $DEFCONFIG
          echo "CONFIG_GOOGLE_ACPM=y" >> $DEFCONFIG
          echo "CONFIG_EXYNOS_ACPM=y" >> $DEFCONFIG
          echo "CONFIG_SOC_GS101=y" >> $DEFCONFIG
        fi

    - name: Build with Bazel
      if: matrix.build_type == 'bazel'
      run: |
        cd kernel_build
        
        export LTO=thin
        export BUILD_CONFIG=common/build.config.gki.aarch64
        
        # Build the kernel
        if [ -f "build/build.sh" ]; then
          build/build.sh || exit 1
        else
          tools/bazel build --config=fast --lto=thin //common:kernel_aarch64_dist || exit 1
        fi

    - name: Build with Make
      if: matrix.build_type == 'make'
      run: |
        cd kernel_build/common
        
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export LLVM=1
        export LLVM_IAS=1
        
        # Setup clang path
        CLANG_PATH="${{ env.TOOLS_DIR }}/build-tools/linux-x86/${{ needs.setup-environment.outputs.clang_version }}/bin"
        export PATH="$CLANG_PATH:$PATH"
        
        # Configure
        make O=out gki_defconfig
        
        # Build
        make O=out -j$(nproc --all) \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          STRIP=llvm-strip \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump

    - name: Package Artifacts
      run: |
        # Create output directory
        OUTPUT_DIR="${{ env.BUILD_ARTIFACTS_DIR }}/${{ matrix.device }}/${{ matrix.build_type }}/${{ matrix.variant }}"
        mkdir -p $OUTPUT_DIR
        
        # Copy kernel image
        if [[ "${{ matrix.build_type }}" == "bazel" ]]; then
          if [[ "${{ inputs.android_version }}" == "android12" || "${{ inputs.android_version }}" == "android13" ]]; then
            cp kernel_build/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist/Image $OUTPUT_DIR/
          else
            cp kernel_build/bazel-bin/common/kernel_aarch64/Image $OUTPUT_DIR/
          fi
        else
          cp kernel_build/common/out/arch/arm64/boot/Image $OUTPUT_DIR/
        fi
        
        # Create AnyKernel3 package
        cd AnyKernel3
        cp $OUTPUT_DIR/Image .
        
        # Device specific AnyKernel3 modifications
        if [[ "${{ matrix.device }}" == "pixel7pro" ]]; then
          sed -i 's/device_names=.*/device_names="cheetah panther"/' anykernel.sh
          sed -i 's/block=.*/block=\/dev\/block\/by-name\/boot/' anykernel.sh
        fi
        
        # Create zip
        ZIP_NAME="WKSU-${{ needs.setup-environment.outputs.clang_version }}-${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ needs.sync-sources.outputs.actual_sublevel }}-${{ matrix.device }}-${{ matrix.variant }}.zip"
        zip -r9 $OUTPUT_DIR/$ZIP_NAME .

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-${{ matrix.device }}-${{ matrix.build_type }}-${{ matrix.variant }}
        path: ${{ env.BUILD_ARTIFACTS_DIR }}/${{ matrix.device }}/${{ matrix.build_type }}/${{ matrix.variant }}/*
        retention-days: 7

  create-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build-kernel
    if: success()

    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: ${{ env.BUILD_ARTIFACTS_DIR }}

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ needs.sync-sources.outputs.actual_sublevel }}
        name: WildKernel ${{ inputs.android_version }} ${{ inputs.kernel_version }}.${{ needs.sync-sources.outputs.actual_sublevel }}
        body: |
          # WildKernel Build
          
          **Android Version:** ${{ inputs.android_version }}
          **Kernel Version:** ${{ inputs.kernel_version }}.${{ needs.sync-sources.outputs.actual_sublevel }}
          **OS Patch Level:** ${{ inputs.os_patch_level }}
          
          ## Build Details
          - Built with ${{ needs.setup-environment.outputs.clang_version }}
          - Includes KernelSU and SUSFS
          - Multiple device support
          
          ## Devices Supported
          ${{ inputs.target_devices }}
          
          ## Variants
          ${{ inputs.build_variants }}
        draft: false
        prerelease: false
        files: ${{ env.BUILD_ARTIFACTS_DIR }}/**/*.zip

  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [setup-environment, sync-sources, build-kernel]
    if: always()

    steps:
    - name: Install ccache
      run: |
        sudo apt update && sudo apt install -y ccache

    - name: Cleanup Workspace
      run: |
        rm -rf ${{ env.KERNEL_SRC_DIR }}
        rm -rf ${{ env.TOOLS_DIR }}
        rm -rf kernel_build
        if command -v ccache >/dev/null 2>&1; then
          ccache --clear --show-stats
        else
          echo "ccache not available, skipping cache cleanup"
        fi

    - name: Upload Build Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          **/*.log
          **/out/**/*.log
        retention-days: 3
